<section class="pratra-hero">
  <div class="container">
    <p class="small fw-semibold pratra-hero-eyebrow text-uppercase mb-2">
      Connected flight discovery
    </p>
    <h1 class="display-6 fw-bold text-white mb-3">
      Find the right flight with <span class="pratra-hero-accent">SkyRoute.</span>
    </h1>
    <p class="pratra-hero-subtitle mb-0 col-lg-7">
      Compare domestic and international schedules, refine fares and stops reactively,
      and inspect complete terminal, baggage, and layover details.
    </p>
  </div>
</section>

<div class="container pratra-search-overlap pb-5">
  @if (vm$ | async; as vm) {
    <div class="mb-5">
      <app-flight-search
        [airports]="vm.airports"
        [initialCriteria]="vm.searchCriteria"
        (searchSubmitted)="onSearchSubmitted($event)"
        (searchReset)="onSearchReset()"
      />
    </div>

    <div class="row g-4 g-xl-5 align-items-start">
      <div class="col-12 col-lg-4 col-xl-3">
        <app-flight-filters
          [airlines]="vm.airlines"
          [priceBounds]="vm.priceBounds"
          [activeFilters]="vm.filterCriteria"
          (filtersChange)="onFiltersChange($event)"
          (filtersReset)="onFiltersReset()"
        />
      </div>

      <div class="col-12 col-lg-8 col-xl-9">
        <app-flight-list
          [flights]="vm.flights"
          [totalMatches]="vm.totalMatches"
          [loading]="vm.loading"
          [error]="vm.error"
          [searchCriteria]="vm.searchCriteria"
          [passengers]="vm.passengers"
          (retry)="onRetry()"
          (resetFilters)="onFiltersReset()"
          (clearSearch)="onSearchReset()"
        />
      </div>
    </div>
  }
</div>
